[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
# Bohr testnet (2026-10-20) and BOT Chain mainnet (2026-10-25) both run PUSH0, TSTORE and MCOPY.
evm_version = "cancun"
optimizer = true
# Tuned for deployment cost on BOT Chain, where gas has a 20 gwei floor: the IR pipeline halves the
# bytecode (1.13M deploy gas against 2.13M); see contracts/README.md for the measurements.
optimizer_runs = 200
via_ir = true

[fuzz]
runs = 1000

[invariant]
runs = 256
depth = 64
fail_on_revert = false

# Network values from https://dev-docs.botchain.ai/docs/Developers/quick-guide/ (checked 2026-10-20).
[rpc_endpoints]
bohr = "https://rpc.bohr.life"
botchain = "https://rpc.botchain.ai"

# Both explorers run Blockscout (Etherscan-compatible /api). No API key is needed.
[etherscan]
bohr = { key = "blockscout", chain = 968, url = "https://scan.bohr.life/api" }
botchain = { key = "blockscout", chain = 677, url = "https://scan.botchain.ai/api" }
